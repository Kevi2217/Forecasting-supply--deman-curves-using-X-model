project:
  random_seed: 42
  timezone: Europe/Madrid
data:
  start_date: '2023-01-01'
  end_date: '2024-12-31'
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  omie_base_url: https://www.omie.es/en/file-download
  request_timeout_seconds: 30
  max_retries: 4
  backoff_seconds: 1.0
  polite_delay_seconds: 0.35
  overwrite: false
omie:
  curves_parent: curva_pbc
  curves_prefix: curva_pbc
  prices_parent: marginalpdbc
  prices_prefix: marginalpdbc
  offered_flag: O
  purchase_code: C
  sale_code: V
  preferred_country: ES
  fallback_country: MI
splits:
  train_end: '2024-06-30'
  validation_end: '2024-09-30'
  test_start: '2024-10-01'
market_validation:
  zonal_price_tolerance_eur_mwh: 0.000001
  # Pre-specified project feasibility gates, not market rules.
  max_clearing_mae_eur_mwh: 10.0
  max_invalid_crossing_share: 0.01

price_classes:
  candidates:
  - 10
  - 20
  - 40
  method: quantile
  tie_tolerance_eur_mwh: 0.05
models:
  primary: elastic_net
  elastic_net:
    alpha_grid:
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    l1_ratio_grid:
    - 0.1
    - 0.5
    - 0.9
    max_iter: 10000
  hist_gradient_boosting:
    enabled: true
    learning_rate_grid:
    - 0.05
    - 0.1
    max_leaf_nodes_grid:
    - 15
    - 31
    max_iter: 150
    l2_regularization: 0.1
